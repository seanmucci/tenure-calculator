<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Trump Tenure Converter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 520px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.45;
    }
    h1 {
      font-size: 1.9rem;
      margin-bottom: 1rem;
      text-align: center;
    }
    label {
      display: block;
      margin-top: 1rem;
    }
    input, select {
      width: 100%;
      font-size: 1rem;
      padding: .45rem;
      margin-top: .4rem;
    }
    #out {
      margin-top: 1.6rem;
      font-weight: bold;
      font-size: 1.25rem;
      text-align: center;
    }
    footer {
      margin-top: 2.2rem;
      font-size: 0.8rem;
      text-align: center;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>Trump Tenure Converter</h1>

  <!-- INPUT NUMBER -->
  <label>
    Enter number:
    <input id="valueInput" type="number" min="0" value="1" />
  </label>

  <!-- INPUT UNIT -->
  <label>
    From:
    <select id="inputUnit"></select>
  </label>

  <!-- OUTPUT UNIT -->
  <label>
    To:
    <select id="outputUnit"></select>
  </label>

  <!-- RESULT -->
  <p id="out"></p>

  <footer>
    Source data: Wikipedia. Stay Tuned for More!
  </footer>

  <script>
    // Units with their length in days (unsorted list)
    const units = [
      { name: "Day",        days: 1    },
      { name: "Scaramucci", days: 10   },
      { name: "Spicer",     days: 182  },
      { name: "Tillerson",  days: 406  },
      { name: "Kelly",      days: 529  },
      { name: "Waltz",      days: 102  },
      { name: "Flynn",      days: 24   },
      { name: "Priebus",    days: 189  },
      { name: "Price",      days: 231  },
      { name: "Mulvaney",   days: 454  },
      { name: "Sessions",   days: 636  },
      { name: "Barr",       days: 679  },
      { name: "DeVos",      days: 1431 },
      { name: "Mnuchin",    days: 1437 },
      { name: "Mattis",     days: 712  }
    ];

    // Elements
    const valueInput = document.getElementById('valueInput');
    const inputSel  = document.getElementById('inputUnit');
    const outputSel = document.getElementById('outputUnit');

    // Populate dropdowns alphabetically
    const sortedUnits = units.slice().sort((a, b) => a.name.localeCompare(b.name));
    sortedUnits.forEach(u => {
      inputSel.add(new Option(u.name, u.days));
      outputSel.add(new Option(u.name, u.days));
    });

    // Default selections (1 Waltz → Scaramucci)
    const defaultFrom = units.find(u => u.name === 'Waltz');
    const defaultTo   = units.find(u => u.name === 'Scaramucci');
    if (defaultFrom) inputSel.value = defaultFrom.days;
    if (defaultTo)   outputSel.value = defaultTo.days;

    // Simple pluralizer
    const pluralize = (name, count) => {
      if (count === 1) return name;
      if (name === 'Day') return 'Days';
      return name + 's';
    };

    function calc() {
      const amount     = Number(valueInput.value);
      const inDays     = Number(inputSel.value);
      const outDays    = Number(outputSel.value);
      if (!amount || inDays === 0 || outDays === 0) {
        document.getElementById('out').textContent = '';
        return;
      }
      const converted  = amount * inDays / outDays;
      const outName    = outputSel.selectedOptions[0].text;
      const resultStr  = `${converted.toFixed(2)} ${pluralize(outName, converted)}`;
      document.getElementById('out').textContent = resultStr;
    }

    // Event listeners
    valueInput.addEventListener('input', calc);
    inputSel.addEventListener('change', calc);
    outputSel.addEventListener('change', calc);

    // Initial calculation
    calc();
  </script>
</body>
</html>
