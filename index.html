<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Trump Tenure Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 480px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.4;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
      text-align: center;
    }
    label {
      display: block;
      margin-top: 1rem;
    }
    input, select {
      width: 100%;
      font-size: 1rem;
      padding: .4rem;
      margin-top: .4rem;
    }
    #out {
      margin-top: 1.5rem;
      font-weight: bold;
      font-size: 1.2rem;
      text-align: center;
    }
    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      text-align: center;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>Trump Tenure Calculator</h1>

  <label>
    Enter number:
    <input id="valueInput" type="number" min="0" value="10" />
  </label>

  <label>
    Choose unit:
    <select id="unit"></select>
  </label>

  <p id="out"></p>

  <footer>
    Source data: Wikipedia. 
  </footer>

  <script>
    // Units: name and length in days
    const officials = [
      { name: "Day", days: 1 },
      { name: "Scaramucci", days: 10 },
      { name: "Spicer", days: 182 },
      { name: "Tillerson", days: 406 },
      { name: "Kelly", days: 529 },
      { name: "Mattis", days: 712 }
    ];

    const unitSel = document.getElementById('unit');
    const valueInput = document.getElementById('valueInput');

    // Populate dropdown
    officials.forEach(o => unitSel.add(new Option(o.name, o.days)));

    const pluralize = (unitName, count) => {
      if (count === 1) return unitName;
      if (unitName === 'Day') return 'Days';
      return unitName + 's';
    };

    function calc() {
      const amount = Number(valueInput.value);
      const denom = Number(unitSel.value);
      const unitName = unitSel.selectedOptions[0].text;
      const result = (amount / denom).toFixed(2);
      document.getElementById('out').textContent = `${result} ${pluralize(unitName, result)}`;
    }

    valueInput.addEventListener('input', calc);
    unitSel.addEventListener('change', calc);

    // initial render
    calc();
  </script>
</body>
</html>
